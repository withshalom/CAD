[workspace]
resolver = "3"
members = [
    "crates/cad-model",
    "crates/cad-dwg",
    "crates/cad-native",
    "crates/cad-dxf",
    "crates/cad-core",
    "crates/cad-ffi",
    "apps/cad-cli",
    "xtask",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.87"
license = "LicenseRef-Proprietary"
publish = false

# No third-party crates anywhere in this workspace. Everything is written
# from scratch against the Rust standard library only. See docs/PROVENANCE.md.
[workspace.dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
