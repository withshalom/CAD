[package]
name = "cad-dwg"
description = "BlackCAD's DWG reader (R13 to 2018 and later, except 2007) and writer (AutoCAD 2018 format)"
version.workspace = true
authors = ["WithShalom <design@withshalom.com>"]
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/withshalom/CAD"
readme = "README.md"
keywords = ["dwg", "cad", "autocad", "drawing", "reader"]
categories = ["parser-implementations", "encoding", "graphics"]

[dependencies]
blackcad-model = { path = "../blackcad-model", version = "0.18.0" }

[dev-dependencies]
# Some writer tests compare against AutoCAD's DXF of the same drawing.
cad-dxf = { path = "../cad-dxf" }
