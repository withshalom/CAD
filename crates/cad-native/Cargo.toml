[package]
name = "cad-native"
description = "BlackCAD's native .blc drawing format: DWG-style container, DXF-coded records, change journal, hash chain, recovery data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/withshalom/CAD"
readme = "README.md"
keywords = ["cad", "drawing", "file-format", "dwg"]
categories = ["parser-implementations", "encoding"]

[dependencies]
cad-model = { path = "../cad-model", version = "0.18.0" }
cad-dwg = { path = "../cad-dwg", version = "0.18.0" }
