[package]
name = "cad-dxf"
description = "BlackCAD's DXF reader and writer (ASCII and binary, AutoCAD 2018 format)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/withshalom/CAD"
readme = "README.md"
keywords = ["dxf", "cad", "autocad", "drawing", "parser"]
categories = ["parser-implementations", "encoding", "graphics"]

[dependencies]
cad-model = { path = "../cad-model", version = "0.18.0" }
cad-dwg = { path = "../cad-dwg", version = "0.18.0" }
