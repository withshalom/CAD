[package]
name = "cad-ffi"
description = "Bridge between the CAD core and the platform apps (JNI entry points for Android)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cad_ffi"
path = "src/lib.rs"
# cdylib: libcad_ffi.so, loaded by the Android app. rlib: for tests and
# other Rust code.
crate-type = ["cdylib", "rlib"]

[dependencies]
cad-core = { path = "../cad-core" }
