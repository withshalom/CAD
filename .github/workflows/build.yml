name: build

on:
  push:
    # gh-pages holds the published web app (the pages job), not sources.
    branches-ignore: [gh-pages]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the Linux binary compatible with glibc 2.35+.
          - os: ubuntu-22.04
            artifact: cad-linux-x86_64
            bin: target/release/cad
          - os: windows-latest
            artifact: cad-windows-x86_64
            bin: target/release/cad.exe
          - os: macos-latest
            artifact: cad-macos-arm64
            bin: target/release/cad
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Lint
        shell: bash
        run: |
          cargo clippy --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Lint" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Test
        shell: bash
        run: |
          cargo test --release 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Test" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Build
        shell: bash
        run: |
          cargo build --release 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Build" "$RUNNER_TEMP/step.log"; exit 1; }
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}

  msrv:
    # The oldest Rust the workspace says it builds with (rust-version in
    # Cargo.toml) must build it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "MSRV $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - name: Check
        shell: bash
        run: |
          cargo check --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "MSRV check" "$RUNNER_TEMP/step.log"; exit 1; }

  android:
    # The Android test viewer (apps/android) as a debug APK. GitHub's Ubuntu
    # image comes with the Android SDK, several NDKs, JDK 17 and Rust; this
    # job adds Rust's Android targets and a pinned Gradle.
    runs-on: ubuntu-24.04
    env:
      GRADLE_VERSION: "9.6.1"
      GRADLE_SHA256: 9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14
      APK: apps/android/app/build/outputs/apk/debug/app-debug.apk
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Native library
        # The newest NDK on the image rather than its default one.
        shell: bash
        run: |
          cargo xtask android --abi all ${ANDROID_NDK_LATEST_HOME:+--ndk "$ANDROID_NDK_LATEST_HOME"} 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Native library" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Gradle
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
      - name: APK
        shell: bash
        run: |
          gradle --no-daemon -p apps/android assembleDebug 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "APK" "$RUNNER_TEMP/step.log"; exit 1; }
      - uses: actions/upload-artifact@v6
        with:
          name: cad-viewer-debug-apk
          path: ${{ env.APK }}
      - name: Check the APK
        # Native libraries aligned for 16 KB pages, and no code but the
        # app's own: no third-party libraries slipped in.
        shell: bash
        run: |
          bash .github/check-apk.sh "$APK" 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Check the APK" "$RUNNER_TEMP/step.log"; exit 1; }

  web:
    # The browser workbench (apps/web): the core built for WebAssembly, the
    # app put together in dist/web/ and as one file, dist/BlackCAD.html, and
    # the core checked through the page's own glue (apps/web/tests). Both
    # are uploaded on every run; the pages job publishes them from main.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Lint
        # The WebAssembly entry points build only for wasm, so the build
        # job's lint does not see them.
        shell: bash
        run: |
          cargo clippy -p cad-ffi --lib --target wasm32-unknown-unknown -- -D warnings 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Web lint" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Build
        shell: bash
        run: |
          cargo xtask web 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Web build" "$RUNNER_TEMP/step.log"; exit 1; }
      - name: Test the core in the page's glue
        shell: bash
        run: |
          node --version
          node apps/web/tests/core.test.mjs dist/web/core.wasm corpus/mosaiciron-mi201 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Web core test" "$RUNNER_TEMP/step.log"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: blackcad-web
          path: dist/web
      - uses: actions/upload-artifact@v7
        # Not zipped: the run's page offers BlackCAD.html itself.
        with:
          path: dist/BlackCAD.html
          archive: false

  pages:
    # The web app and BlackCAD.html published from main once every job has
    # passed: the gh-pages branch holds a single commit, replaced each time,
    # which GitHub Pages serves (Settings → Pages → Build and deployment:
    # Deploy from a branch, gh-pages, / (root)).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, msrv, android, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      # The custom domain, for this repository only (forks publish without one).
      PAGES_DOMAIN: ${{ github.repository == 'withshalom/CAD' && 'cad.mosaiciron.com' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: blackcad-web
          path: site
      - uses: actions/download-artifact@v8
        with:
          name: BlackCAD.html
          path: site
      - name: Publish to gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/publish-pages.sh site 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { bash .github/annotate-failure.sh "Publish" "$RUNNER_TEMP/step.log"; exit 1; }
